#--------------------------------------------------------------------------
# DATA: dg_swagwaf_trusted_proxies.conf
#--------------------------------------------------------------------------
# ABSTRACT: Optional BIG-IP IP data group of vetted reverse proxies and load
#     balancers whose X-Forwarded-For header SwagWAF is allowed to trust. When
#     the verified L4 peer matches a record here, SwagWAF logs the left-most
#     XFF entry as true_client for ISA traceability. This affects LOGGING only;
#     rate-limit enforcement still keys on the verified L4 peer. If this data
#     group is absent, XFF is never trusted and true_client equals the L4 peer.
#
# WARNING: Only list infrastructure you control and that reliably appends a
#     correct X-Forwarded-For value. Trusting XFF from an arbitrary peer would
#     let a client spoof its own origin. Records are the L4 peer addresses of
#     the proxies, not the downstream client addresses.
# CREATED: 260804 BY: JN
# UPDATED: 260804 BY: JN
# VERSION: 0.1.0
#--------------------------------------------------------------------------

ltm data-group internal /Common/dg_swagwaf_trusted_proxies {
    records {
        "198.51.100.10" {
            data "owner=EXAMPLE;role=reverse-proxy;ticket=CHG0123456"
        }
    }
    type ip
}
