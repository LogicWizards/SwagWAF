#--------------------------------------------------------------------------
# DATA: dg_swagwaf_trusted_sources.conf
#--------------------------------------------------------------------------
# ABSTRACT: Canonical BIG-IP IP data group for sources that bypass SwagWAF
#     rate limiting. Record values carry owner, service, ticket, and expiry
#     metadata into structured ISA logs. TLS enforcement, XFF sanitation,
#     payload inspection, and response hardening remain active.
# CREATED: 260730 BY: JN
# UPDATED: 260731 BY: Sol(GPT5.6)::Copilot:MAC-00
# VERSION: 0.1.0
#--------------------------------------------------------------------------

ltm data-group internal /Common/dg_swagwaf_trusted_sources {
    records {
        "192.0.2.0/24" {
            data "owner=EXAMPLE;service=SYNTHETIC;ticket=CHG0123456;expires=2026-12-31"
        }
    }
    type ip
}